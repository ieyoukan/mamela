# Example site definition. Copy to mamela.site.toml (gitignored) and fill in real values.
# All values below are fictional. Never commit real hostnames, addresses or tokens.
#
# The site holds only what Mamela needs whatever the infrastructure (ADR 0006). Everything about one
# infrastructure (its API, tokens, pools, storages, safety thresholds) is the provider's:
# mamela.providers.toml and the declarations.

schema = "mamela-site/v1"

[guest]
# The login of the machines (their seed): the user and an SSH public key file (optional, outside
# the repository).
user = "mamela"
ssh_public_key_file = "~/.ssh/id_ed25519.pub"

[budget]
# The most one machine may have, whatever its provider (checked against the measures of the host's
# catalogs, at plan and at apply).
max_vcpu_per_vm = 2
max_memory_mib_per_vm = 4096
max_disk_gib_per_vm = 20

[network]
# How machines may get their IPv4 address. Both are explicit.
dhcp = true                               # machines declared with Dhcp get their address from the network's DHCP
# Optional: the range set aside for static addresses (machines declared with Static(...)).
# It must be outside the DHCP server's pool and every address in use on the network.
static_first = "10.0.0.40"
static_last = "10.0.0.49"

[controlplane]
# Optional. With it, new machines get mamelet (the Mamela agent) from their seed, and pull from the
# Control Plane (`mamela serve`).
url = "https://10.0.0.45:8443"            # as the machines reach it
listen = "0.0.0.0:8443"                   # where `mamela serve` listens
state_dir = "~/.config/mamela/cp"         # CA and signing keys, outside the repository
mamelet_binary = ".mamela/bin/mamelet-linux-amd64"   # built by scripts/build-mamelet.sh
# The machine the Control Plane runs on, if Mamela manages it: its plans never change it (ADR 0003).
host = ""
# Moving existing mamelets to another Control Plane: revisions carry this URL and mamelet uses it
# from then on (ADR 0003).
move_to = ""
