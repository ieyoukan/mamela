name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Emela publishes Linux binaries for x86_64 only.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # `emela test` (JS target) runs on Node.js.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned toolchain (emela, wasmtime; sha256-verified)
        run: scripts/install-toolchain.sh
      - name: Check
        run: scripts/check.sh
