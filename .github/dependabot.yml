# Keeps the pinned GitHub Actions and Go modules up to date with weekly pull requests.
# toolchain.lock (emela, wasmtime), .node-version, the toolchain line of go.mod and the Pome.lock
# files are updated by hand (see docs/development.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
